
name: week9-mongodb

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${W9_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${W9_MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${W9_MONGO_USER}:${W9_MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${W9_MONGO_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${W9_MONGO_PASSWORD}
    depends_on:
      - mongo

volumes:
  mongo_data:
